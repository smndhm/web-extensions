<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="false" />
    <title>Music Bridge</title>
  </head>
  <body>
    <main class="options">
      <!-- The browser shows the options in its own settings page, under the extension name: keep the heading for assistive technologies only -->
      <h1 class="visually-hidden" data-i18n="optionsTitle"></h1>
      <p class="options__intro" data-i18n="optionsIntro"></p>
      <form class="options__form">
        <div class="field">
          <label class="field__label" for="streaming-platforms" data-i18n="optionsStreamingPlatformLabel"></label>
          <select class="field__select" id="streaming-platforms" name="platform"></select>
        </div>
        <div class="field field--check" id="open-app-option">
          <input class="field__checkbox" type="checkbox" id="open-app" name="openInApp" aria-describedby="open-app-help" />
          <label class="field__label" for="open-app" data-i18n="optionsOpenAppLabel"></label>
          <p class="field__help" id="open-app-help" data-i18n="optionsOpenAppHelp"></p>
        </div>
        <div class="field field--check" id="close-tab-option">
          <input class="field__checkbox" type="checkbox" id="close-tab" name="closeTab" aria-describedby="close-tab-help" />
          <label class="field__label" for="close-tab" data-i18n="optionsCloseTabLabel"></label>
          <p class="field__help" id="close-tab-help" data-i18n="optionsCloseTabHelp"></p>
        </div>
        <div class="save" id="save-options">
          <p class="save__status" role="status" id="save-status"></p>
          <button class="save__button" type="submit" data-i18n="optionsSaveButton"></button>
        </div>
      </form>
    </main>
    <footer class="credits"></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
