<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="false" />
    <title>Music Bridge</title>
  </head>
  <body class="ds-l-page">
    <main class="ds-l-page__main">
      <!-- The browser shows the options in its own settings page, under the extension name: keep the heading for assistive technologies only -->
      <h1 class="ds-u-visually-hidden" data-i18n="optionsTitle"></h1>
      <p data-i18n="optionsIntro"></p>
      <form class="ds-l-stack">
        <div class="ds-c-field">
          <label class="ds-c-field__label" for="streaming-platforms" data-i18n="optionsStreamingPlatformLabel"></label>
          <select class="ds-c-field__control" id="streaming-platforms" name="platform"></select>
        </div>
        <div class="ds-c-card ds-c-checkbox" id="open-app-option">
          <input class="ds-c-checkbox__control" type="checkbox" id="open-app" name="openInApp" aria-describedby="open-app-help" />
          <label class="ds-c-checkbox__label" for="open-app" data-i18n="optionsOpenAppLabel"></label>
          <p class="ds-c-checkbox__description" id="open-app-help" data-i18n="optionsOpenAppHelp"></p>
        </div>
        <div class="ds-c-card ds-c-checkbox" id="close-tab-option">
          <input class="ds-c-checkbox__control" type="checkbox" id="close-tab" name="closeTab" aria-describedby="close-tab-help" />
          <label class="ds-c-checkbox__label" for="close-tab" data-i18n="optionsCloseTabLabel"></label>
          <p class="ds-c-checkbox__description" id="close-tab-help" data-i18n="optionsCloseTabHelp"></p>
        </div>
        <!-- Settings are saved as they change: one message under them says so, for a moment, and screen readers announce it -->
        <p class="ds-c-field__message" role="status" id="save-status"></p>
      </form>
    </main>
    <footer class="ds-c-footer ds-u-text-muted"></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
