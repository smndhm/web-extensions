<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="false" />
    <title>Music Bridge</title>
  </head>
  <body>
    <main class="options">
      <!-- The browser shows the options in its own settings page, under the extension name: keep the heading for assistive technologies only -->
      <h1 class="ds-u-visually-hidden" data-i18n="optionsTitle"></h1>
      <p class="options__intro" data-i18n="optionsIntro"></p>
      <form class="options__form">
        <div class="ds-c-field">
          <label class="ds-c-field__label" for="streaming-platforms" data-i18n="optionsStreamingPlatformLabel"></label>
          <select class="ds-c-field__control options__select" id="streaming-platforms" name="platform"></select>
        </div>
        <div class="check" id="open-app-option">
          <input class="check__box" type="checkbox" id="open-app" name="openInApp" aria-describedby="open-app-help" />
          <label class="check__label" for="open-app" data-i18n="optionsOpenAppLabel"></label>
          <p class="check__help" id="open-app-help" data-i18n="optionsOpenAppHelp"></p>
        </div>
        <div class="check" id="close-tab-option">
          <input class="check__box" type="checkbox" id="close-tab" name="closeTab" aria-describedby="close-tab-help" />
          <label class="check__label" for="close-tab" data-i18n="optionsCloseTabLabel"></label>
          <p class="check__help" id="close-tab-help" data-i18n="optionsCloseTabHelp"></p>
        </div>
        <!-- Settings are saved as they change: one message under them says so, for a moment, and screen readers announce it -->
        <p class="options__status" role="status" id="save-status"></p>
      </form>
    </main>
    <footer class="credits"></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
