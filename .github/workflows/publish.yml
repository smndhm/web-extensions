name: Publish extension

on:
  workflow_dispatch:
    inputs:
      extension:
        description: Extension to publish
        required: true
        type: choice
        options:
          - dzr-link
          - dzr-tab
          - music-bridge
      stores:
        description: Stores to submit to
        required: true
        type: choice
        default: chrome+firefox+edge
        options:
          - chrome+firefox+edge
          - chrome+firefox
          - chrome
          - firefox
          - edge
      dry-run:
        description: Dry run (check the credentials, upload nothing)
        required: true
        type: boolean
        default: true
  # Called by the Release workflow for each released extension
  workflow_call:
    inputs:
      extension:
        required: true
        type: string
      stores:
        required: false
        type: string
        default: chrome+firefox+edge
      dry-run:
        required: true
        type: boolean
      release-tag:
        description: GitHub release to attach the zips to
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.extension }}

jobs:
  publish:
    name: Publish ${{ inputs.extension }} (${{ inputs.stores }}${{ inputs.dry-run && ', dry run' || '' }})
    runs-on: ubuntu-latest
    # One GitHub environment per extension holds its store IDs (CHROME_EXTENSION_ID, FIREFOX_EXTENSION_ID,
    # EDGE_PRODUCT_ID). Without EDGE_PRODUCT_ID, the extension is not submitted to Edge.
    environment: ${{ inputs.extension }}
    permissions:
      contents: write # Attach the zips to the GitHub release
    defaults:
      run:
        working-directory: extensions/${{ inputs.extension }}
    env:
      STORES: ${{ inputs.stores }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tags of the previous releases, to tell whether the listing texts changed
          fetch-depth: 0

      - uses: smndhm/dev-config/ci/setup@c98471f274ad7f8641b899aab2fe615d055ae04a # main

      - name: Type check
        run: pnpm compile

      # Edge takes the Chrome zip
      - name: Zip for Chrome and Edge
        if: contains(inputs.stores, 'chrome') || contains(inputs.stores, 'edge')
        run: pnpm zip

      - name: Zip for Firefox
        if: contains(inputs.stores, 'firefox')
        run: pnpm zip:firefox

      - name: Upload zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.extension }}-zips
          path: extensions/${{ inputs.extension }}/.output/*.zip
          if-no-files-found: error
          # WXT writes the zips to .output/, a hidden directory
          include-hidden-files: true

      - name: Attach the zips to the GitHub release
        if: inputs.release-tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release upload "$RELEASE_TAG" .output/*.zip --clobber

      - name: Submit to the stores
        env:
          EXTENSION: ${{ inputs.extension }}
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          set -o pipefail
          dryRun=()
          if [[ "$DRY_RUN" == "true" ]]; then dryRun=(--dry-run); fi
          # Each store is submitted, the step fails after if one did: one store refusing the version does not hold
          # the others back
          failed=0

          # Chrome and Edge, both from the Chrome zip
          others=()
          if [[ "$STORES" == *chrome* ]]; then
            others+=(--chrome-zip .output/*-chrome.zip)
          fi
          if [[ "$STORES" == *edge* ]]; then
            if [[ -n "$EDGE_PRODUCT_ID" ]]; then
              others+=(--edge-zip .output/*-chrome.zip)
            else
              echo "::notice::No EDGE_PRODUCT_ID in the ${{ inputs.extension }} environment: not submitted to Edge"
            fi
          fi
          if [[ ${#others[@]} -gt 0 ]]; then
            pnpm exec wxt submit "${others[@]}" "${dryRun[@]}" || failed=1
          fi

          # addons.mozilla.org on its own, to try it again without submitting to the other stores twice: AMO throttles
          # its API right after another extension's upload (429), as the AMO listing script does, wait as long as it
          # says, three times at most and two minutes each
          if [[ "$STORES" == *firefox* ]]; then
            # Notes for reviewers and release notes of the version
            node ../../scripts/amo-listing.ts "$EXTENSION" --version-metadata .output/amo-version.json
            firefox=(--firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip --firefox-amo-metadata-file .output/amo-version.json)
            for attempt in 1 2 3 4; do
              if pnpm exec wxt submit "${firefox[@]}" "${dryRun[@]}" 2>&1 | tee .output/firefox-submit.log; then
                break
              fi
              # A throttled call may come after the version is created: trying again finds it there
              if grep -q 'already exists' .output/firefox-submit.log; then
                echo "::warning::This version is already on addons.mozilla.org: check that its release notes and source code are there"
                break
              fi
              wait=$(grep -oE 'available in [0-9]+ seconds' .output/firefox-submit.log | grep -oE '[0-9]+' | tail -n 1)
              if [[ -z "$wait" || $attempt -eq 4 || $wait -gt 120 ]]; then
                failed=1
                break
              fi
              echo "AMO API throttled: retrying in $((wait + 5)) s"
              sleep $((wait + 5))
            done
          fi
          exit "$failed"

      # Each AMO API call counts toward its rate limit, and a version upload uses much of it: update the
      # listing only when its texts changed since the previous release of the extension
      - name: Did the listing texts change?
        id: listing
        if: ${{ !cancelled() && contains(inputs.stores, 'firefox') }}
        env:
          EXTENSION: ${{ inputs.extension }}
        run: |
          version=$(node -p "require('./package.json').version")
          previous=$(git tag --list "$EXTENSION@*" --sort=-v:refname | grep -vxF "$EXTENSION@$version" | head -n 1)
          if [[ -z "$previous" ]] || ! git diff --quiet "$previous" HEAD -- public/_locales 'store/description-*.md' 'store/privacy-*.md' ../../scripts/amo-listing.ts; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The addons.mozilla.org listing texts did not change since $previous: listing left as it is"
          fi

      # The listing texts (name, summary, description, categories) follow the released version.
      # The images change less often: the AMO listing workflow replaces them on demand.
      # Also when another store refused the version (a Chrome review still pending, for example)
      - name: Update the addons.mozilla.org listing
        if: ${{ !cancelled() && contains(inputs.stores, 'firefox') && steps.listing.outputs.changed == 'true' }}
        env:
          EXTENSION: ${{ inputs.extension }}
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          args=("$EXTENSION")
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          node ../../scripts/amo-listing.ts "${args[@]}"
