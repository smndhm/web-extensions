name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changesets:
    name: Version or release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the changeset-release/main branch, the tags and the GitHub releases
      pull-requests: write # Open the "Version Packages" pull request
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # changeset publish compares against the existing tags

      - uses: smndhm/dev-config/ci/setup@73fa94bee891551a9ae9f455bf7c6dbb3f71bd09 # main

      # The version script draws Music Bridge's logo colors and renders its images when its version changes
      - name: Pending changesets
        id: pending
        run: echo "changesets=$(find .changeset -name '*.md' ! -name README.md | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Install Chromium
        if: steps.pending.outputs.changesets != '0'
        run: pnpm --filter dzr-tab exec playwright install --with-deps --no-shell chromium

      # With pending changesets: open or update the "Version Packages" pull request.
      # Without: tag each extension whose version has no tag yet and create its GitHub release.
      - name: Version Packages pull request or release
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish

  # The Firefox smoke tests against the real redirect service, on the "Version Packages" pull request: its result, a
  # commit status, shows before merging it releases. The other tests ask a stand-in of the service (scripts/firefox.ts).
  # A pull request opened with GITHUB_TOKEN does not trigger the CI: this job runs here instead.
  live-test:
    name: Live test of the Version Packages pull request
    needs: changesets
    if: needs.changesets.outputs.has-changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # Report the live test on the pull request's commit
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: changeset-release/main

      - name: Report pending status
        run: |
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state=pending -f context="Live test" \
            -f description="The Firefox smoke tests against the real redirect service" -f target_url="$TARGET_URL"

      - uses: smndhm/dev-config/ci/setup@73fa94bee891551a9ae9f455bf7c6dbb3f71bd09 # main

      - name: Zip for Firefox
        run: pnpm zip:firefox

      # Firefox is preinstalled on GitHub-hosted Ubuntu runners
      - name: Test in Firefox against the real redirect service
        id: test
        run: firefox --version && pnpm test:firefox:live

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firefox-screenshots-live
          path: .output/firefox/*.png
          if-no-files-found: ignore
          # .output/ is a hidden directory
          include-hidden-files: true

      - name: Report status
        if: always()
        env:
          STATE: ${{ steps.test.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state="$STATE" -f context="Live test" \
            -f description="The Firefox smoke tests against the real redirect service" -f target_url="$TARGET_URL"

  submit:
    name: Submit ${{ matrix.package.name }}@${{ matrix.package.version }}
    needs: changesets
    if: needs.changesets.outputs.published == 'true'
    strategy:
      fail-fast: false
      # One extension at a time: the stores, addons.mozilla.org first, throttle parallel submissions
      # made with the same API key
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.changesets.outputs.published-packages) }}
    permissions:
      contents: write # Attach the zips to the GitHub release
    uses: ./.github/workflows/publish.yml
    with:
      extension: ${{ matrix.package.name }}
      # Safe by default: only a dry run until the SUBMIT_ON_RELEASE repository variable is "true"
      dry-run: ${{ vars.SUBMIT_ON_RELEASE != 'true' }}
      release-tag: ${{ matrix.package.name }}@${{ matrix.package.version }}
    secrets: inherit
