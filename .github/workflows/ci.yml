name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: smndhm/dev-config/ci/setup@73fa94bee891551a9ae9f455bf7c6dbb3f71bd09 # main

      - name: Lint and format check
        run: pnpm lint

      - name: Type check
        run: pnpm compile

      - name: Unit tests
        run: pnpm test

      - name: Build for Chrome
        run: pnpm build

      - name: Build for Firefox
        run: pnpm build:firefox

      # Mozilla's linter, the one addons.mozilla.org runs on each submission
      - name: Lint the Firefox builds
        run: pnpm lint:firefox

  a11y:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: smndhm/dev-config/ci/setup@73fa94bee891551a9ae9f455bf7c6dbb3f71bd09 # main

      # Chromium only: GitHub-hosted Ubuntu runners have Google Chrome, so the libraries it needs. Without --with-deps,
      # which installed them again with fonts and Xvfb the headless checks do not need (14 of the step's 20 s)
      - name: Install Chromium
        run: pnpm --filter dzr-tab exec playwright install --no-shell chromium

      - name: Build for Chrome
        run: pnpm build

      # Every extension with an a11y script (dzr-link's moving page, dzr-tab's new tab, music-bridge's options), one after the other
      - name: Check accessibility
        run: pnpm a11y

  firefox:
    name: Firefox smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: smndhm/dev-config/ci/setup@73fa94bee891551a9ae9f455bf7c6dbb3f71bd09 # main

      - name: Zip for Firefox
        run: pnpm zip:firefox

      # Firefox is preinstalled on GitHub-hosted Ubuntu runners
      - name: Test in Firefox
        run: firefox --version && pnpm test:firefox

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firefox-screenshots
          path: .output/firefox/*.png
          if-no-files-found: ignore
          # .output/ is a hidden directory
          include-hidden-files: true
