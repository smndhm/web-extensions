name: Store screenshots

on:
  workflow_dispatch:
    inputs:
      extension:
        description: Extension to take screenshots of
        required: true
        type: choice
        options:
          - dzr-tab
          - music-bridge
      count:
        description: Number of screenshots (dzr-tab, one per Deezer track)
        required: true
        type: number
        default: 5

permissions:
  contents: read

jobs:
  screenshots:
    name: ${{ inputs.extension }} screenshots
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/${{ inputs.extension }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --no-shell chromium

      - name: Build for Chrome
        run: pnpm build

      # dzr-tab: the new tab page with real Deezer tracks; music-bridge: the options page in English and
      # French, light and dark
      - name: Take screenshots
        env:
          COUNT: ${{ inputs.count }}
        run: pnpm screenshots "$COUNT"

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.extension }}-screenshots
          path: extensions/${{ inputs.extension }}/.output/screenshots/*.png
          if-no-files-found: error
          # WXT writes to .output/, a hidden directory
          include-hidden-files: true
