name: Renovate → Changesets

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  # Adds the changesets of the updated dependencies, then runs the CI checks on that commit (see smndhm/dev-config)
  changesets:
    name: Add changeset
    uses: smndhm/dev-config/.github/workflows/changesets-renovate.yml@53b9676b0670cba6a8c4a396fb20e8db4d933956 # main
    permissions:
      contents: write
      statuses: write
    with:
      checks: |
        pnpm lint
        pnpm compile
        pnpm test
        pnpm build
        pnpm build:firefox
        pnpm lint:firefox
        pnpm --filter dzr-tab exec playwright install --with-deps --no-shell chromium
        pnpm a11y
        pnpm zip:firefox
        pnpm test:firefox
