name: Test links

# Finds Music Bridge's manual test links (extensions/music-bridge/TESTING.md) with the Deezer charts and the Music Bridge redirect service, and
# commits them to the branch (not main). With "Check", checks instead that the redirect service handles the links of
# TESTING.md, on any branch, main included
on:
  workflow_dispatch:
    inputs:
      check:
        description: Check the links of TESTING.md with the redirect service, instead of finding new ones
        type: boolean
        default: false

permissions:
  contents: write # Commit TESTING.md

jobs:
  test-links:
    name: Music Bridge test links
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/music-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: smndhm/dev-config/.github/actions/setup@53b9676b0670cba6a8c4a396fb20e8db4d933956 # main

      - name: Check the links
        if: inputs.check
        run: pnpm test-links --check

      - name: Find the links
        if: ${{ !inputs.check }}
        run: pnpm test-links && pnpm exec prettier --write TESTING.md

      - name: Commit the links
        if: ${{ !inputs.check && github.ref_name != github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TESTING.md
          git commit -m "docs(music-bridge): new test links" && git push || echo "No change"
