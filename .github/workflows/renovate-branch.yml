name: Renovate branch

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  # Copies @dume/dev-config's files, adds the changesets, then runs the CI checks on that commit (see smndhm/dev-config)
  renovate-branch:
    uses: smndhm/dev-config/.github/workflows/renovate-branch.yml@4074f1550123768d54f0d9da6af48521026f0c47 # main
    permissions:
      contents: write
      statuses: write
    with:
      changesets: true
      checks: |
        pnpm lint
        pnpm compile
        pnpm test
        pnpm build
        pnpm build:firefox
        pnpm lint:firefox
        pnpm --filter dzr-tab exec playwright install --no-shell chromium
        pnpm a11y
        pnpm zip:firefox
        pnpm test:firefox
